name: Regenerate io (temporary)

on:
  push:
    branches: [thermo-mdl]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
      - name: Fetch S2A2
        run: git clone --depth 1 https://github.com/luciangreen/S2A2 ../S2A2
      - name: New tests (output as an annotation)
        run: |
          set +e
          timeout 900 swipl -g "load_files('tests/mdl_tests.pl'), load_files('tests/aioc_assessment_tests.pl'), load_files('tests/aioc_library_tests.pl'), load_files('tests/s2a2_bridge_tests.pl'), (run_tests -> halt(0) ; halt(1))" > out.txt 2>&1
          code=$?
          echo "exit $code"
          echo "::error::RAW $(tr '\r' '\n' < out.txt | grep -v ' passed (' | grep -v Singleton | head -c 3000 | gzip -c | base64 -w0)"
          exit $code
      - name: Regenerate io
        run: swipl io/make_ios.pl
      - name: Commit io
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add io/ios.txt io/ios.pl
          git diff --cached --quiet || git commit -m "Regenerate io/ios.txt and io/ios.pl with the mdl case"
          git push
