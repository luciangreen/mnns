name: Regenerate io (temporary)

on:
  push:
    branches: [thermo-proof]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
      - name: Fetch S2A2
        run: git clone --depth 1 https://github.com/luciangreen/S2A2 ../S2A2
      - name: Show clauses
        run: |
          swipl -g "use_module('prolog/thermo/thermo'), forall(member(P, [rank(_,_,_,_,_,_,_), choose(_,_,_,_,_,_,_,_,_,_), unrank(_,_,_,_,_,_)]), forall(clause(mnn_thermo:P, B), (with_output_to(string(S), print((P:-B))), split_string(S, \"\\n\", \"\", Ls), atomic_list_concat(Ls, ' ', A), format('::warning::~w~n', [A])))), halt"
      - name: Thermo tests (output as an annotation)
        run: |
          set +e
          timeout 600 swipl -g "load_files('tests/thermo_induction_tests.pl'), load_files('tests/thermo_tests.pl'), (run_tests -> halt(0) ; halt(1))" > out.txt 2>&1
          code=$?
          echo "exit $code"
          echo "::error::RAW $(tr '\r' '\n' < out.txt | grep -v ' passed (' | grep -v Singleton | head -c 2500 | gzip -c | base64 -w0)"
          exit $code
      - name: Regenerate io
        run: swipl io/make_ios.pl
      - name: Commit io
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add io/ios.txt io/ios.pl
          git diff --cached --quiet || git commit -m "Regenerate io/ios.txt and io/ios.pl with the thermo_incorporate case"
          git push
