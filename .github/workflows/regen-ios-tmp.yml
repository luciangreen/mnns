name: Regenerate io (temporary)

on:
  push:
    branches: [thermo-mnn]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
      - name: Fetch S2A2
        run: git clone --depth 1 https://github.com/luciangreen/S2A2 ../S2A2
      - name: Thermo tests (failures shown as annotations)
        run: |
          set +e
          timeout 600 swipl -g "load_files('tests/thermo_tests.pl'), (run_tests(mnn_thermo) -> halt(0) ; halt(1))" > thermo-raw.txt 2>&1
          code=$?
          tr "\r" "\n" < thermo-raw.txt > thermo-out.txt
          grep -vE "passed|Singleton|^Warning: /|^\s*$" thermo-out.txt | head -9 | while IFS= read -r line; do echo "::error::$line"; done
          grep -vE "passed|Singleton|^Warning: /|^\s*$" thermo-out.txt | sed -n '10,18p' | while IFS= read -r line; do echo "::warning::$line"; done
          grep -vE "passed|Singleton|^Warning: /|^\s*$" thermo-out.txt | sed -n '19,27p' | while IFS= read -r line; do echo "::notice::$line"; done
          exit $code
      - name: All tests
        run: timeout 900 swipl -q -s tests/run.pl
      - name: Regenerate io
        run: swipl io/make_ios.pl
      - name: Commit io
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add io/ios.txt io/ios.pl
          git diff --cached --quiet || git commit -m "Regenerate io/ios.txt and io/ios.pl with the thermo cases"
          git push
